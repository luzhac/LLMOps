global:
  nodeSelector: {workload: system}

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
  # Portfolio project, no public ingress. Access via kubectl port-forward.
  service:
    type: ClusterIP

repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false

redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
