# Second ArgoCD Application: lets ArgoCD deploy and manage the monitoring
# stack too, instead of a manual `helm upgrade --install monitoring ...`.
#
# Multi-source Application: source 1 pulls the chart straight from the
# prometheus-community Helm repo; source 2 is a git "ref" source that only
# supplies files (values file + dashboard ConfigMap) — it is not rendered or
# applied on its own, `$values` in source 1 and the third source's `directory`
# filter both reference it.
#
# targetRevision for the chart is a placeholder — verify the real current
# kube-prometheus-stack version with `helm search repo prometheus-community/kube-prometheus-stack`
# before applying, and pin it exactly (ArgoCD Helm chart sources need an exact version here).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "88.3.0"
      helm:
        valueFiles:
          - $values/platform/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/luzhac/LLMOps.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/luzhac/LLMOps.git
      targetRevision: main
      path: platform/monitoring
      directory:
        include: "dashboard-configmap.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack's CRDs (prometheuses, alertmanagers, scrapeconfigs,
      # ...) each exceed 256KB. Client-side apply stores the whole manifest in the
      # last-applied-configuration annotation and Kubernetes rejects it with
      # "metadata.annotations: Too long: may not be more than 262144 bytes", so
      # those CRDs never install, the Prometheus CR can't be created, and every
      # dashboard silently shows no data. Server-side apply doesn't write that
      # annotation and is the supported fix.
      - ServerSideApply=true
  revisionHistoryLimit: 5
