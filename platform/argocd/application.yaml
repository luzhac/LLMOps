# Replace repoURL and gateway image values before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trade-balance-llm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/luzhac/LLMOps.git
    targetRevision: main
    path: platform/helm/trade-balance-llm
    helm:
      # Only overrides what actually needs an environment-specific value
      # (values.yaml's gateway.image.repository is a placeholder). Everything
      # else, including vllm.replicaCount, is controlled by the chart's own
      # values.yaml — one place to change it, not two.
      values: |
        gateway:
          image:
            repository: CHANGEME_REGION-docker.pkg.dev/CHANGEME_PROJECT/trade-balance-llm/gateway
            tag: "0.1.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-platform
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, PruneLast=true]
  revisionHistoryLimit: 5
  # No ignoreDifferences here on purpose: selfHeal stays fully authoritative.
  # If ArgoCD is managing this Application, vllm's replica count is controlled
  # by editing platform/helm/trade-balance-llm/values.yaml (vllm.replicaCount) and
  # pushing — not by kubectl scale. See runbook 14 for the two mutually
  # exclusive on/off paths (plain Helm + script vs GitOps).

