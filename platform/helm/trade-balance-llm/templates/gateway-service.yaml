apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    {{- include "trade-balance-llm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http

