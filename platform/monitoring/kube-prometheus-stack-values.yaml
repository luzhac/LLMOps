fullnameOverride: monitoring

alertmanager:
  enabled: false

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 500m, memory: 512Mi}
  nodeSelector: {workload: system}

prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 4GB
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {cpu: "1", memory: 2Gi}
    nodeSelector: {workload: system}

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
  nodeSelector: {workload: system}
  # The admission webhook validates PrometheusRule CRs before they are accepted.
  # Its TLS cert is generated by two one-shot Jobs (monitoring-admission-create /
  # -patch) that delete themselves via helm.sh/hook-delete-policy once finished.
  # ArgoCD renders those Jobs, then cannot find them in the cluster, and fails the
  # entire sync with:
  #   "Resource batch/Job/monitoring-admission-create is missing,
  #    it might have been deleted (retried 5 times)"
  # That single failure blocks every other resource in the Application — the
  # dashboard ConfigMap silently stops updating while the UI still looks fine.
  # Disabling the webhook removes the Jobs entirely. The cost is that a malformed
  # PrometheusRule is rejected later (by Prometheus at load time) instead of at
  # admission; acceptable for a single-maintainer project, and the standard fix
  # for running this chart under ArgoCD.
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  tls:
    enabled: false

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false

